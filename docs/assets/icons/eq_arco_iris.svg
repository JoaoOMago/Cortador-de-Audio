<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Cada barra tem uma cor diferente — arco-íris -->
    <linearGradient id="c1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF2D55;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6B8A;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="c2" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF9500;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCC02;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="c3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#34C759;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#30D158;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="c4" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#007AFF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#40A9FF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="c5" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#BF5AF2;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#DA8FFF;stop-opacity:1" />
    </linearGradient>
    <filter id="glow5">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="#080808"/>
  <!-- Barras arco-íris, cada uma com cor própria e altura variada -->
  <rect x="12" y="58" width="12" height="24" rx="6" fill="url(#c1)" filter="url(#glow5)"/>
  <rect x="28" y="36" width="12" height="46" rx="6" fill="url(#c2)" filter="url(#glow5)"/>
  <rect x="44" y="18" width="12" height="64" rx="6" fill="url(#c3)" filter="url(#glow5)"/>
  <rect x="60" y="30" width="12" height="52" rx="6" fill="url(#c4)" filter="url(#glow5)"/>
  <rect x="76" y="50" width="12" height="32" rx="6" fill="url(#c5)" filter="url(#glow5)"/>
  <!-- Reflexo suave na base -->
  <rect x="12" y="83" width="12" height="6" rx="3" fill="url(#c1)" opacity="0.2"/>
  <rect x="28" y="83" width="12" height="6" rx="3" fill="url(#c2)" opacity="0.2"/>
  <rect x="44" y="83" width="12" height="6" rx="3" fill="url(#c3)" opacity="0.2"/>
  <rect x="60" y="83" width="12" height="6" rx="3" fill="url(#c4)" opacity="0.2"/>
  <rect x="76" y="83" width="12" height="6" rx="3" fill="url(#c5)" opacity="0.2"/>
</svg>
