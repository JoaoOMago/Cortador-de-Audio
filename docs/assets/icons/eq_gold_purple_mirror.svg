<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <!-- Gradiente de baixo (frio/roxo) para cima (dourado) -->
    <linearGradient id="g3" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#5500FF;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#AA00FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD700;stop-opacity:1" />
    </linearGradient>
    <filter id="glow3">
      <feGaussianBlur stdDeviation="1.8" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="#08040F"/>
  <!-- Barras estilo "espelho" - crescem do centro -->
  <!-- Barra 1 espelho -->
  <rect x="14" y="50" width="10" height="15" rx="4" fill="url(#g3)" opacity="0.55" filter="url(#glow3)"/>
  <rect x="14" y="35" width="10" height="15" rx="4" fill="url(#g3)" opacity="0.55" transform="scale(1,-1) translate(0,-100)" filter="url(#glow3)"/>
  <!-- Barra 2 espelho -->
  <rect x="28" y="42" width="10" height="23" rx="4" fill="url(#g3)" opacity="0.75" filter="url(#glow3)"/>
  <rect x="28" y="35" width="10" height="23" rx="4" fill="url(#g3)" opacity="0.75" transform="scale(1,-1) translate(0,-100)" filter="url(#glow3)"/>
  <!-- Barra central espelho -->
  <rect x="43" y="34" width="12" height="32" rx="5" fill="url(#g3)" filter="url(#glow3)"/>
  <rect x="43" y="34" width="12" height="32" rx="5" fill="url(#g3)" transform="scale(1,-1) translate(0,-100)" filter="url(#glow3)"/>
  <!-- Barra 4 espelho -->
  <rect x="60" y="40" width="10" height="25" rx="4" fill="url(#g3)" opacity="0.75" filter="url(#glow3)"/>
  <rect x="60" y="35" width="10" height="25" rx="4" fill="url(#g3)" opacity="0.75" transform="scale(1,-1) translate(0,-100)" filter="url(#glow3)"/>
  <!-- Barra 5 espelho -->
  <rect x="74" y="48" width="10" height="17" rx="4" fill="url(#g3)" opacity="0.55" filter="url(#glow3)"/>
  <rect x="74" y="35" width="10" height="17" rx="4" fill="url(#g3)" opacity="0.55" transform="scale(1,-1) translate(0,-100)" filter="url(#glow3)"/>
  <!-- Linha central de simetria -->
  <line x1="12" y1="50" x2="88" y2="50" stroke="#FFD700" stroke-width="1" opacity="0.2"/>
</svg>
