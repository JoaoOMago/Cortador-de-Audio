<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g2a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF0080;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FF6EC7;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g2b" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#FF6600;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFCC00;stop-opacity:1" />
    </linearGradient>
    <filter id="glow2">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="#0F0508"/>
  <!-- Barras alternando rosa/laranja = efeito sunset/vaporwave -->
  <rect x="14" y="58" width="10" height="24" rx="5" fill="url(#g2b)" filter="url(#glow2)"/>
  <rect x="28" y="40" width="10" height="42" rx="5" fill="url(#g2a)" filter="url(#glow2)"/>
  <rect x="42" y="18" width="12" height="64" rx="6" fill="url(#g2b)" filter="url(#glow2)"/>
  <rect x="58" y="34" width="10" height="48" rx="5" fill="url(#g2a)" filter="url(#glow2)"/>
  <rect x="72" y="50" width="10" height="32" rx="5" fill="url(#g2b)" filter="url(#glow2)"/>
  <!-- Grade horizontal de fundo -->
  <line x1="12" y1="84" x2="88" y2="84" stroke="#FF0080" stroke-width="1" opacity="0.15"/>
  <line x1="12" y1="65" x2="88" y2="65" stroke="#FF0080" stroke-width="1" opacity="0.08"/>
  <line x1="12" y1="46" x2="88" y2="46" stroke="#FF0080" stroke-width="1" opacity="0.08"/>
  <line x1="12" y1="27" x2="88" y2="27" stroke="#FF0080" stroke-width="1" opacity="0.08"/>
</svg>
