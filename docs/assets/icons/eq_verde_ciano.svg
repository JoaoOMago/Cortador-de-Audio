<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g1" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#00F5A0;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00D9F5;stop-opacity:1" />
    </linearGradient>
    <filter id="glow1">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="#050F0D"/>
  <!-- Barras do equalizador com glow verde/ciano -->
  <rect x="14" y="60" width="10" height="22" rx="5" fill="url(#g1)" opacity="0.5" filter="url(#glow1)"/>
  <rect x="28" y="44" width="10" height="38" rx="5" fill="url(#g1)" opacity="0.7" filter="url(#glow1)"/>
  <rect x="42" y="20" width="12" height="62" rx="6" fill="url(#g1)" filter="url(#glow1)"/>
  <rect x="58" y="36" width="10" height="46" rx="5" fill="url(#g1)" opacity="0.7" filter="url(#glow1)"/>
  <rect x="72" y="52" width="10" height="30" rx="5" fill="url(#g1)" opacity="0.5" filter="url(#glow1)"/>
  <!-- Linha base -->
  <line x1="12" y1="84" x2="88" y2="84" stroke="#00F5A0" stroke-width="1.5" opacity="0.2"/>
  <!-- Pontos no topo de cada barra -->
  <circle cx="19" cy="58" r="2.5" fill="#00D9F5"/>
  <circle cx="33" cy="42" r="2.5" fill="#00D9F5"/>
  <circle cx="48" cy="18" r="3" fill="#00F5A0"/>
  <circle cx="63" cy="34" r="2.5" fill="#00D9F5"/>
  <circle cx="77" cy="50" r="2.5" fill="#00D9F5"/>
</svg>
