<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100" width="100" height="100">
  <defs>
    <linearGradient id="g4a" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0040FF;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#00CFFF;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="g4b" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" style="stop-color:#0020AA;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0080D0;stop-opacity:1" />
    </linearGradient>
    <filter id="glow4">
      <feGaussianBlur stdDeviation="2" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="100" height="100" rx="18" fill="#020510"/>
  <!-- Barras estilo "retro LED" - azul elétrico, barras segmentadas -->
  <!-- Barra 1 - 3 segmentos -->
  <rect x="14" y="72" width="10" height="6" rx="2" fill="url(#g4b)" filter="url(#glow4)"/>
  <rect x="14" y="64" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.6" filter="url(#glow4)"/>
  <rect x="14" y="56" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.3" filter="url(#glow4)"/>
  <!-- Barra 2 - 5 segmentos -->
  <rect x="28" y="72" width="10" height="6" rx="2" fill="url(#g4b)" filter="url(#glow4)"/>
  <rect x="28" y="64" width="10" height="6" rx="2" fill="url(#g4a)" filter="url(#glow4)"/>
  <rect x="28" y="56" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.7" filter="url(#glow4)"/>
  <rect x="28" y="48" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.4" filter="url(#glow4)"/>
  <rect x="28" y="40" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.2" filter="url(#glow4)"/>
  <!-- Barra 3 - 8 segmentos (central) -->
  <rect x="43" y="72" width="12" height="6" rx="2" fill="url(#g4b)" filter="url(#glow4)"/>
  <rect x="43" y="64" width="12" height="6" rx="2" fill="url(#g4a)" filter="url(#glow4)"/>
  <rect x="43" y="56" width="12" height="6" rx="2" fill="url(#g4a)" filter="url(#glow4)"/>
  <rect x="43" y="48" width="12" height="6" rx="2" fill="url(#g4a)" opacity="0.8" filter="url(#glow4)"/>
  <rect x="43" y="40" width="12" height="6" rx="2" fill="url(#g4a)" opacity="0.6" filter="url(#glow4)"/>
  <rect x="43" y="32" width="12" height="6" rx="2" fill="url(#g4a)" opacity="0.4" filter="url(#glow4)"/>
  <rect x="43" y="24" width="12" height="6" rx="2" fill="url(#g4a)" opacity="0.2" filter="url(#glow4)"/>
  <!-- Barra 4 - 6 segmentos -->
  <rect x="60" y="72" width="10" height="6" rx="2" fill="url(#g4b)" filter="url(#glow4)"/>
  <rect x="60" y="64" width="10" height="6" rx="2" fill="url(#g4a)" filter="url(#glow4)"/>
  <rect x="60" y="56" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.8" filter="url(#glow4)"/>
  <rect x="60" y="48" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.5" filter="url(#glow4)"/>
  <rect x="60" y="40" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.3" filter="url(#glow4)"/>
  <rect x="60" y="32" width="10" height="6" rx="2" fill="url(#g4a)" opacity="0.15" filter="url(#glow4)"/>
  <!-- Barra 5 - 4 segmentos -->
  <rect x="74" y="72" width="10" height="6" rx="2" fill="url(#g4b)" filter="url(#glow4)"/>
  <rect x="74" y="64" width="10" height="6" rx="2" fill="url(#g4a)" filter="url(#glow4)"/>
